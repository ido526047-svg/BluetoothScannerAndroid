name: Build Bluetooth Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q BluetoothScannerAndroid_Project.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/BluetoothScannerAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothScanner-debug
          path: extracted/BluetoothScannerAndroid/app/build/outputs/apk/debug/app-debug.apk
